process:
  name: ddim
  T_train: 500
  T_true: 200
  beta_min: 0.0001
  beta_max: 0.02
  true_order: heun
sweep:
  d:
  - 4
  K:
  - 32
  anchors:
  - 20000
  - 50000
  - 100000
classifier:
  _shared:
    hidden: 256
    depth: 4
    degree: 3
    epochs: 30
    batch: 2048
    lr: 0.003
    weight_decay: 0.0001
    min_steps: 3000
    ensemble: 3
    k: 10
    bandwidth: 1.0
    temperature: 0.1
    threshold: auto
    confidence: entropy
  primary: polar8
  models:
  - name: knn
    arch: knn
  - name: altered_knn
    arch: altered_knn
  - name: quadratic
    arch: quadratic
  - name: polar8
    arch: polar
    degree: 8
stages:
- train
device: cuda
seed: 0
n_seeds: 3
run_id: 2026-09-20_19-42-55
data:
  sigma: 0.1
  radius: 2.0
  m_mult: 1.5
  mass_q: 0.99
train:
  force_retrain: true
  base_steps: 30000
  lr: 0.001
  lr_min: 1.0e-05
  grad_clip: 1.0
  ema_decay: 0.999
  ema_warmup: 1000
  batch: 512
  cuda_graph: true
  graph_streams: true
  probe_n: 10000
  hall_target: 0.015
  step_growth: 1.7
  max_attempts: 2
eval:
  n_eval: 200000
anchors:
  seed: 0
  shell_frac: 0.5
  shell_sigma: 2.0
  n_calibrate: 5000
  altered_knn:
    n_rings: 5
    r_max: 1.5
    weight: linear
    w_min: 0.2
paths:
  root: ${oc.env:ATLAS_ROOT,${oc.env:PWD}}
  data: ${paths.root}/data
  output: ${paths.root}/output
