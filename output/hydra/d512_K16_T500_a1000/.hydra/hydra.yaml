hydra:
  run:
    dir: ${paths.output}/hydra/${run_id}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - process=ddim
    - data=gmm
    - data.weighted=false
    - process.T_train=500
    - process.T_true=500
    - sweep.d=[512]
    - sweep.K=[16]
    - seed=0
    - n_seeds=1
    - data.radius=2.0
    - stages=[evaluate]
    - train.force_retrain=false
    - device=cuda
    - sweep.anchors=[1000]
    - run_id=d512_K16_T500_a1000
  job:
    name: main
    chdir: false
    override_dirname: data.radius=2.0,data.weighted=false,data=gmm,device=cuda,n_seeds=1,process.T_train=500,process.T_true=500,process=ddim,run_id=d512_K16_T500_a1000,seed=0,stages=[evaluate],sweep.K=[16],sweep.anchors=[1000],sweep.d=[512],train.force_retrain=false
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /home/pmehrotra3/workspace/test_run/iclr_code
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/pmehrotra3/workspace/test_run/iclr_code/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/pmehrotra3/workspace/test_run/iclr_code/output/hydra/d512_K16_T500_a1000
    choices:
      classifier@classifier.models.polar3: polar3
      classifier@classifier.models.quadratic: quadratic
      classifier@classifier.models.altered_knn: altered_knn
      classifier@classifier.models.knn: knn
      classifier: base
      anchors: altered_knn
      eval: base
      train: base
      sweep: base
      data: gmm
      process: ddim
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
