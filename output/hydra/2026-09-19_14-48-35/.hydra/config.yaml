process:
  name: flow
  T_train: 150
  T_true: 400
  sigma_min: 0.0001
  solver: euler
sweep:
  d:
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  K:
  - 2
  - 4
  - 8
  - 16
  - 32
  anchors:
  - 2000
  - 5000
  - 10000
  - 20000
  - 50000
  - 100000
classifier:
  _shared:
    hidden: 256
    depth: 4
    degree: 3
    epochs: 30
    batch: 2048
    lr: 0.003
    weight_decay: 0.0001
    min_steps: 3000
    ensemble: 3
    k: 10
    bandwidth: 1.0
    temperature: 0.1
    threshold: auto
    confidence: entropy
  primary: polar3
  models:
  - name: knn
    arch: knn
  - name: altered_knn
    arch: altered_knn
  - name: polar3
    arch: polar
    degree: 3
stages:
- evaluate
- visualize
device: cuda
seed: 0
run_id: 2026-09-19_04-50-15
data:
  sigma: 0.1
  radius: 2.0
  m_mult: 1.5
  mass_q: 0.99
train:
  force_retrain: false
  base_steps: 3000
  lr: 0.001
  batch: 512
  probe_n: 10000
  hall_target: 0.03
  step_growth: 1.7
  max_attempts: 6
eval:
  n_eval: 20000
anchors:
  seed: 0
  shell_frac: 0.5
  shell_sigma: 2.0
  n_calibrate: 5000
  altered_knn:
    n_rings: 5
    r_max: 1.5
    weight: linear
    w_min: 0.2
paths:
  root: ${oc.env:ATLAS_ROOT,${oc.env:PWD}}
  data: ${paths.root}/data
  output: ${paths.root}/output
