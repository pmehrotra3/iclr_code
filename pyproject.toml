[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-fate-atlas"
version = "0.2.0"
description = "Predicting a diffusion / flow sampler's fate (mode or hallucination) from the seed alone"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7",
  "hydra-core>=1.3", "omegaconf>=2.3",
]

[tool.setuptools]
package-dir = {"" = "code"}
packages = ["atlas", "atlas.stages", "atlas.conf", "ddim", "flow"]

[tool.setuptools.package-data]
"atlas.conf" = ["*.yaml", "*/*.yaml"]
