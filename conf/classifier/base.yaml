# classifier/base - hyper-parameters shared by every predictor (_shared); a predictor's own
# file (knn.yaml, polar3.yaml, ...) overrides them

_shared:
  hidden: 256           # polar: width of the (direction, radius) projection
  degree: 3             # polar: polynomial degree
  epochs: 30            # parametric: training epochs
  batch: 2048           # parametric: minibatch size
  lr: 0.003             # parametric: peak learning rate (one-cycle)
  weight_decay: 0.0001  # parametric: AdamW weight decay
  min_steps: 3000       # parametric: at least this many gradient steps
  ensemble: 3           # parametric: models averaged (non-parametric: 1)
  k: 10                 # knn / altered_knn: neighbours
  temperature: 0.1      # altered_knn: softmax temperature on the vote
  threshold: auto       # altered_knn: confidence cut in [0,1], or auto (max F1 on calibration)
  confidence: entropy   # altered_knn: entropy | max
