# @package classifier
# The three seed -> fate predictors, fit on the backtracked anchors and scored against the
# learned sampler's ground truth. _shared is merged into every model entry (see evaluate._spec).
#   knn         : vote of the k nearest anchors (mode balls + hallucination band)
#   altered_knn : weighted kNN over mode-only anchors; low-confidence vote = hallucination
#   polar3      : degree-3 polynomial boundary in (direction, radius) with a margin hallucination rule
_shared:
  hidden: 256
  depth: 4
  degree: 3
  epochs: 30
  batch: 2048
  lr: 0.003
  weight_decay: 0.0001
  min_steps: 3000        # at least this many gradient steps, so small anchor sets converge
  ensemble: 3            # parametric models are averaged over this many seeds (non-parametric: 1)
  k: 10                  # knn / altered_knn neighbours
  bandwidth: 1.0         # kernel: h = bandwidth x median nearest-anchor distance
  temperature: 0.1       # altered_knn: p = softmax(weighted vote / temperature)
  threshold: auto        # altered_knn: number in [0,1], or auto = maximise hallucination F1 on the calib set
  confidence: entropy    # altered_knn: entropy (1 - H(p)/log K) | max (max_k p_k)

primary: polar3          # the model summarised in the console line and figures

models:
  - {name: knn,         arch: knn}
  - {name: altered_knn, arch: altered_knn}
  - {name: polar3,      arch: polar, degree: 3}
