# train/base - learned-model training settings

force_retrain: false  # retrain even if a checkpoint exists
base_steps: 30000     # steps = base_steps * (1 + d/16) * (1 + K/16)
lr: 0.001             # initial learning rate
lr_min: 1.0e-5        # cosine-decay floor (null = off)
grad_clip: 1.0        # gradient-norm clip (null = off)
ema_decay: 0.999      # weight EMA decay (null = off)
ema_warmup: 1000      # steps to ramp EMA decay up to ema_decay
batch: 512            # minibatch size
n_train: 100000       # fixed training set per (d, K, seed); null = fresh samples every step
cuda_graph: true      # capture the train step in a CUDA graph (removes launch overhead; same maths)
graph_streams: true   # one stream per seed inside that graph (seeds train concurrently, ~2x).
                      # main.sh turns this off when JOBS_PER_GPU > 1: several such processes
                      # on one GPU intermittently crash (illegal memory access, driver 565)
probe_n: 10000        # samples to probe the hallucination rate
hall_target: 0.015    # retry until probe hall <= this
step_growth: 1.7      # multiply steps by this on each retry
max_attempts: 2       # retry once with step_growth x steps; a miss is saved and flagged not_converged
