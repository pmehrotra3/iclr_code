# data/base - settings shared by every dataset

mass_q: 0.99  # mass of a mode inside its R99 ball: the mode / hallucination boundary
# mixing weights over the K modes. false: uniform 1/K. true: one random profile (U[0.3, 0.8],
# normalised) that each repeat seed assigns to the modes by its own permutation. The training
# data and the exact field use the same weights. The two variants are separate experiments:
# output/<run_id>/{checkpoints/<process>/,<process>/}<weighted|unweighted>/
weighted: false
