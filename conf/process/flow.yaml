name: flow
T_train: 500      # 150 was too coarse: at d>=32 even the EXACT score hallucinates (see README)
T_true: 200
sigma_min: 0.0001
solver: euler         # learned-sampler ODE solver: euler | midpoint | heun | rk4
true_solver: heun     # exact-velocity backtrack solver (Step 3): heun (2nd order) recommended
