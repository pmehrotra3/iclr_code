# anchors/base - general atlas-anchor settings shared by every anchor set

seed: 0            # RNG seed for anchor sampling
strategy: ball     # anchors for knn / quadratic / polar: ball (ball + shell) | polar_weighted
shell_frac: 0.5    # (ball) hallucination-band anchors per mode (fraction of ball anchors)
shell_sigma: 2.0   # (ball) band width in sigma: R99 .. R99 + shell_sigma * sigma
n_calibrate: 5000  # seeds labelled by exact score to calibrate the hallucination cut
