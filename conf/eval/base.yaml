# eval/base - ground-truth evaluation settings

# ground-truth seeds pushed through the learned sampler = n_eval_per_mode * K, so the per-mode
# count stays constant as K grows (K=2 -> 100k, K=16 -> 800k)
n_eval_per_mode: 50000
part: false           # true: only write this job's cell files, do not rebuild results.json
                      # (scripts/main.sh runs evaluate per d, then stages=[merge,visualize])
force: false          # true: recompute the requested (budget, predictor) rows even if the cell
                      # file already holds them
