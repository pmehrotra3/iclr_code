# flow — OT flow matching (Lipman et al.), deterministic ODE sampler.
# Composes the shared groups in common/conf; everything below is flow-specific or an override.
defaults:
  - base
  - sweep: full
  - classifier: atlas
  - override hydra/job_logging: disabled
  - _self_

hydra:
  searchpath:
    - pkg://common.conf

process: flow

flow:
  sigma_min: 0.0001         # sigma_min in Eq. 20-23
  solver: euler             # euler | heun | midpoint | rk4 -- the learned sampler (the ground truth)
  true_solver: heun         # integrator of the EXACT-velocity passes (analytic control, anchor backtrack)
