# baselines — RODS (Tian et al. 2025) and IQ (Sobieski et al. 2026) as
# sampling-time corrections on top of the ddim process.
#
# Each is a Process that inherits everything from ddim except sample(), so the
# schedule, the training objective, the analytic field and every stage behave
# identically. Pick which one with `process=`.
defaults:
  - base
  - sweep: full
  - classifier: mlp
  - override hydra/job_logging: disabled
  - _self_

hydra:
  searchpath:
    - pkg://common.conf

process: rods_cas           # rods_cas | rods_sas | iq

# must match ddim's schedule, or the reused checkpoints are not valid
ddim:
  beta_min: 0.1
  beta_max: 20.0

# shared knobs; the selected process reads its own block
_corr: &corr
  rho_frac: 0.15            # perturbation radius as a fraction of d_min
  q_pct: 99.0               # PER-STEP quantile: 99 -> ~T/100 corrections/trajectory
  n_mc: 8                   # noise draws for the IQ DSM/LID estimate (paper: 32)
  lam: 0.1                  # IQ guidance magnitude ratio
  n_calibrate: 2000         # seeds used to calibrate the per-step thresholds
  chunk: 20000

# stage `basin`: which samplers to compare against the analytic reference
basin:
  n_eval: 20000            # falls back to eval.n_eval if omitted
  samplers: [ddim, rods_cas, rods_sas, iq]

rods_cas: *corr
rods_sas: *corr
iq: *corr