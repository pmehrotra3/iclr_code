# =====================================================================================
#  Shared defaults for every process folder (ddim/conf/config.yaml, flow/conf/config.yaml
#  compose this file, pick a sweep and a classifier preset, and add their own knobs).
#  Override anything on the command line:
#     python code/ddim/main.py sweep=d2 classifier=fast stages=[atlas,atlas_viz]
# =====================================================================================

process: ???                # set by the process folder (ddim | flow)

# The pipeline. train: the learned sampler per (d, K), cached in checkpoints/.
#   atlas: plant labelled anchors in data space -> backtrack with the exact score -> fit every
#   predictor on the labelled seed picture -> score against the learned sampler, swept over T
#   and anchor budget. atlas_merge combines per-d shards (scripts/run.sh); atlas_viz draws.
stages: [train, atlas, atlas_viz]

run_tag: ""                 # results + figures go under output/<run_tag>/<process>/ ("" = output/<process>/)

device: auto                # auto | cpu | cuda
seed: 0

# ------------------------------------------------------------------ reference GMM
data:
  sigma: 0.1                # within-mode std
  radius: 2.0               # sphere radius the modes live on
  m_mult: 1.0               # min-separation multiplier (centres >= 5 sigma apart for d > 2, 3 sigma at d = 2)
  mass_q: 0.99              # mode core mass fraction (defines R99)

# ------------------------------------------------------------------ the learned sampler (stage: train)
# The score network is the ONLY trained object. Recipe: AdamW-free Adam, cosine lr decay, gradient
# clipping and an EMA of the weights (Process.fit); retrain with step_growth x more steps until the
# hallucination rate on probe seeds is <= (1 - mass_q) + hall_excess. Checkpoints store the recipe
# and are retrained on demand when it changes.
train:
  force_retrain: false
  base_steps: 30000         # scaled by (1 + d/16)(1 + K/16)
  lr: 0.001
  batch: 512
  probe_n: 10000
  hall_target: 0.03         # absolute stop target, used only when hall_excess is null
  hall_excess: 0.005        # stop when hallucination <= (1 - mass_q) + hall_excess
  step_growth: 1.7
  max_attempts: 4
  net: {h: 256, nb: 4, td: 128}   # ScoreNet backbone
  ema: 0.999                # EMA decay of the weights that are sampled from (0 = off)
  lr_final: 0.01            # cosine-decay the learning rate to lr * lr_final over the run (1 = constant)
  grad_clip: 1.0            # clip the gradient norm (0 = off)
  weight_decay: 0.0         # AdamW weight decay (0 = plain Adam)

# ------------------------------------------------------------------ ground truth (atlas step 4)
eval:
  n_eval: 200000            # fresh Gaussian seeds pushed through the learned sampler and labelled with L
  seed_offset: 1000

# ------------------------------------------------------------------ anchors (atlas step 1)
anchors:
  budgets: [20000, 50000, 100000]   # anchors per cell; every budget is fitted, the best is reported
  unit: total               # total: budget = anchors per cell (mode balls + bands) | per_mode: per mode ball
  shell_frac: 0.5           # band anchors per mode, as a fraction of the mode-ball anchors
  shell_sigma: 2.0          # band width in units of sigma: R99 .. R99 + shell_sigma * sigma
  seed: 0
  n_calibrate: 5000         # seeds labelled by the exact score at each T: calibrate altered_knn's
                            #   threshold and the parametric models' hallucination prior
  altered_knn:              # altered_knn's own anchor set: per mode, n_rings concentric spheres of radius
    n_rings: 5              #   R99 * r_max * j / n_rings, every anchor labelled with its mode and weighted
    r_max: 1.5              #   linear: 1 - (1 - w_min) r / (r_max R99) | gaussian: exp(-r^2 / 2 sigma^2)
    weight: linear
    w_min: 0.2

paths:
  root: ${oc.env:ATLAS_ROOT,${oc.env:PWD}}
  checkpoints: ${paths.root}/checkpoints
  output: ${paths.root}/output

hydra:
  run:
    dir: ${paths.output}/hydra/${process}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
pullback:
  d: ${sweep.d}             # cells to study (ddim only; uses the sweep.T_train checkpoint)
  K: [2, 4]
  n_seeds: 200000           # seeds drawn to find intermodal hallucinations
  n_study: 40               # hallucinated seeds studied per cell
  deep_mult: 1.5            # intermodal = > deep_mult * R99 from every mode, between its two nearest
  field: learned            # learned | true   -- sampler whose hallucinations we study
  iq_energy: learned        # learned | true   -- denoiser inside IQ's LID energy (true = exact GMM)
  lam: 0.0                  # IQ strength; 0 = best-rescuing value from lam_grid
  lam_grid: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05]
  iq_t0: 0.02               # time at which the DSM loss (LID estimate) is evaluated
  iq_window: 1.0            # IQ active for t <= iq_window (1.0 = whole run)
  n_mc: 64                  # noise draws in the LID estimate (antithetic pairs)
  n_rand: 16                # random directions per seed for the efficiency baseline
  n_tan: 4                  # tangent directions per anchor for the Prop. 4 tangent control
  tang_mult: 1.0            # tangent step size, in units of eps* (Prop. 4 is first order in eps)
  eps_max: 3.0              # largest seed step searched along a direction
  n_eps_grid: 80
  newton_iters: 4           # per-step Newton iterations when inverting IQ endpoints
  seed: 0
  ckpt_process: null        # checkpoints/sampler to use; null = cfg.process (set to ddim when
                            # running this stage from another process's main, e.g. baselines)
  animate: true             # d = 2: also write the trajectory animation (pullback_viz)
  anim_frames: 120          # sampling steps shown in the animation (subsampled if T is larger)


psweep:
  d: [2, 4, 8, 16, 32]
  K: [2, 4, 8, 16]
  n_eval: 20000
  field: learned
  eps_grid: [0.003, 0.01, 0.03, 0.06, 0.1, 0.2, 0.3, 0.5]
  chunk: 4096
  ckpt_process: null
  seed: 0
