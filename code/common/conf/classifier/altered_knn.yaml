# @package classifier
# altered_knn: weighted kNN over concentric-ring anchors (mode labels + radius weights, no
# hallucination class); a low-confidence neighbour vote => hallucination.
#   classifier._shared.k=20 classifier._shared.threshold=0.6 classifier._shared.confidence=max
#   anchors.rings.n_rings=8 anchors.rings.r_max=2 anchors.rings.weight=gaussian
_shared: &defaults     # merged into every model entry below
  hidden: 256
  depth: 4
  degree: 3
  epochs: 30
  batch: 2048
  lr: 0.003
  weight_decay: 0.0001
  min_steps: 3000
  ensemble: 3
  k: 10
  bandwidth: 1.0
  temperature: 0.1
  threshold: auto           # altered_knn: number in [0,1], or auto = maximise halluc. F1 on true-score-labeled seeds
  confidence: entropy
primary: altered_knn
models:
  - {name: altered_knn, arch: altered_knn, anchors: rings, <<: *defaults}
  - {name: knn,         arch: knn, <<: *defaults}
