# @package classifier
# Gaussian-kernel vote in seed space (no training). Override: classifier._shared.bandwidth=2
_shared: &defaults     # merged into every model entry below
  hidden: 256
  depth: 4
  degree: 2
  epochs: 30
  batch: 2048
  lr: 0.003
  weight_decay: 0.0001
  min_steps: 3000
  ensemble: 3
  k: 10
  bandwidth: 1.0
primary: kernel
models:
  - {name: kernel, arch: kernel, <<: *defaults}
