# @package classifier
# linear boundaries: hyperplanes (linear), + margin band (margin), + norm term (radial)
_shared: &defaults     # merged into every model entry below
  hidden: 256
  depth: 4
  degree: 2
  epochs: 30
  batch: 2048
  lr: 0.003
  weight_decay: 0.0001
  min_steps: 3000
  ensemble: 3
  k: 10
  bandwidth: 1.0
primary: linear
models:
  - {name: linear, arch: linear, lr: 0.03, <<: *defaults}
  - {name: margin, arch: margin, lr: 0.03, <<: *defaults}
  - {name: radial, arch: radial, lr: 0.03, <<: *defaults}
