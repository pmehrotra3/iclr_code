# @package classifier
# quadratic boundaries: explicit [x, x_i x_j] features (quadratic) and degree-2 polar polynomial
_shared: &defaults     # merged into every model entry below
  hidden: 256
  depth: 4
  degree: 2
  epochs: 30
  batch: 2048
  lr: 0.003
  weight_decay: 0.0001
  min_steps: 3000
  ensemble: 3
  k: 10
  bandwidth: 1.0
primary: quadratic
models:
  - {name: quadratic, arch: quadratic, lr: 0.03, <<: *defaults}
  - {name: polar2, arch: polar, degree: 2, <<: *defaults}
