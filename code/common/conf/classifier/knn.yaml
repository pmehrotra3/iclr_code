# @package classifier
# k-nearest-neighbour vote in seed space (no training). Override k: classifier._shared.k=25
_shared: &defaults     # merged into every model entry below
  hidden: 256
  depth: 4
  degree: 2
  epochs: 30
  batch: 2048
  lr: 0.003
  weight_decay: 0.0001
  min_steps: 3000
  ensemble: 3
  k: 10
  bandwidth: 1.0
primary: knn
models:
  - {name: knn, arch: knn, <<: *defaults}
